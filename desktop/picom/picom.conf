# frOSt Picom Compositor Configuration
# Provides shadows, fading, rounded corners, and transparency

# Backend - use glx for GPU acceleration, xrender as fallback
backend = "xrender";

# Shadows
shadow = true;
shadow-radius = 12;
shadow-offset-x = -7;
shadow-offset-y = -7;
shadow-opacity = 0.6;
shadow-color = "#000000";
shadow-exclude = [
    "name = 'Notification'",
    "class_g = 'Conky'",
    "class_g ?= 'Notify-osd'",
    "class_g = 'Cairo-clock'",
    "_GTK_FRAME_EXTENTS@:c",
    "class_g = 'xfce4-panel'",
    "class_g = 'xfce4-notifyd'",
];

# Fading
fading = true;
fade-in-step = 0.05;
fade-out-step = 0.05;
fade-delta = 5;
fade-exclude = [];

# Opacity
inactive-opacity = 0.92;
frame-opacity = 0.9;
inactive-opacity-override = false;
focus-exclude = [
    "class_g = 'Cairo-clock'",
    "class_g = 'xfce4-panel'",
];
opacity-rule = [
    "85:class_g = 'xfce4-terminal'",
    "95:class_g = 'Thunar'",
    "95:class_g = 'Mousepad'",
];

# Rounded corners
corner-radius = 8;
rounded-corners-exclude = [
    "class_g = 'xfce4-panel'",
    "window_type = 'dock'",
    "window_type = 'desktop'",
];

# General settings
vsync = true;
mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
use-damage = true;
log-level = "warn";

# Window type rules
wintypes:
{
    tooltip = { fade = true; shadow = false; opacity = 0.9; focus = true; };
    dock = { shadow = false; clip-shadow-above = true; };
    dnd = { shadow = false; };
    popup_menu = { opacity = 0.95; shadow = true; };
    dropdown_menu = { opacity = 0.95; shadow = true; };
};
