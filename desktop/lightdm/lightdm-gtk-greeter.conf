[greeter]
background = /usr/share/backgrounds/frost/wallpaper.png
theme-name = Adwaita-dark
icon-theme-name = Adwaita
font-name = Hack 11
xft-antialias = true
xft-dpi = 96
xft-hintstyle = hintslight
xft-rgba = rgb

# Panel
panel-position = top
indicators = ~host;~spacer;~clock;~spacer;~session;~power

# Colors
default-user-image = /usr/share/backgrounds/frost/frost-logo.png

# Clock
clock-format = %H:%M  |  %a %d %b
