<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowText" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Crystal / Snowflake logo centered -->
  <g transform="translate(200, 170)" filter="url(#glow)">
    <!-- Outer hex -->
    <polygon points="0,-100 86.6,-50 86.6,50 0,100 -86.6,50 -86.6,-50"
      fill="none" stroke="#00d4ff" stroke-width="1.5" opacity="0.3"/>

    <!-- Six arms -->
    <g stroke="#00d4ff" stroke-width="2" fill="none" opacity="0.8">
      <line x1="0" y1="0" x2="0" y2="-90"/>
      <line x1="0" y1="-35" x2="-15" y2="-52"/>
      <line x1="0" y1="-35" x2="15" y2="-52"/>
      <line x1="0" y1="-60" x2="-20" y2="-78"/>
      <line x1="0" y1="-60" x2="20" y2="-78"/>

      <line x1="0" y1="0" x2="77.94" y2="-45"/>
      <line x1="29.24" y1="-16.88" x2="48.74" y2="-38.44"/>
      <line x1="29.24" y1="-16.88" x2="48.74" y2="-5.63"/>
      <line x1="51.96" y1="-30" x2="71.46" y2="-51.56"/>
      <line x1="51.96" y1="-30" x2="71.46" y2="-18.75"/>

      <line x1="0" y1="0" x2="77.94" y2="45"/>
      <line x1="29.24" y1="16.88" x2="48.74" y2="5.63"/>
      <line x1="29.24" y1="16.88" x2="48.74" y2="38.44"/>
      <line x1="51.96" y1="30" x2="71.46" y2="18.75"/>
      <line x1="51.96" y1="30" x2="71.46" y2="51.56"/>

      <line x1="0" y1="0" x2="0" y2="90"/>
      <line x1="0" y1="35" x2="-15" y2="52"/>
      <line x1="0" y1="35" x2="15" y2="52"/>
      <line x1="0" y1="60" x2="-20" y2="78"/>
      <line x1="0" y1="60" x2="20" y2="78"/>

      <line x1="0" y1="0" x2="-77.94" y2="45"/>
      <line x1="-29.24" y1="16.88" x2="-48.74" y2="5.63"/>
      <line x1="-29.24" y1="16.88" x2="-48.74" y2="38.44"/>
      <line x1="-51.96" y1="30" x2="-71.46" y2="18.75"/>
      <line x1="-51.96" y1="30" x2="-71.46" y2="51.56"/>

      <line x1="0" y1="0" x2="-77.94" y2="-45"/>
      <line x1="-29.24" y1="-16.88" x2="-48.74" y2="-38.44"/>
      <line x1="-29.24" y1="-16.88" x2="-48.74" y2="-5.63"/>
      <line x1="-51.96" y1="-30" x2="-71.46" y2="-51.56"/>
      <line x1="-51.96" y1="-30" x2="-71.46" y2="-18.75"/>
    </g>

    <!-- Center core -->
    <polygon points="0,-18 15.59,-9 15.59,9 0,18 -15.59,9 -15.59,-9"
      fill="#00d4ff" opacity="0.25" stroke="#00d4ff" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="5" fill="#00d4ff" opacity="0.9"/>

    <!-- Red tips -->
    <circle cx="0" cy="-90" r="3" fill="#ff2d2d" opacity="0.8"/>
    <circle cx="77.94" cy="-45" r="3" fill="#ff2d2d" opacity="0.8"/>
    <circle cx="77.94" cy="45" r="3" fill="#ff2d2d" opacity="0.8"/>
    <circle cx="0" cy="90" r="3" fill="#ff2d2d" opacity="0.8"/>
    <circle cx="-77.94" cy="45" r="3" fill="#ff2d2d" opacity="0.8"/>
    <circle cx="-77.94" cy="-45" r="3" fill="#ff2d2d" opacity="0.8"/>
  </g>

  <!-- frOSt text -->
  <g transform="translate(200, 310)" filter="url(#glowText)">
    <text text-anchor="middle" font-family="monospace, 'Courier New'"
      font-size="56" font-weight="bold" letter-spacing="4">
      <tspan fill="#00d4ff">fr</tspan><tspan fill="#e0f0ff">OS</tspan><tspan fill="#00d4ff">t</tspan>
    </text>
    <text text-anchor="middle" y="28" font-family="monospace, 'Courier New'"
      font-size="12" fill="#6b8299" letter-spacing="6">
      FROZEN OPERATING SYSTEM
    </text>
  </g>
</svg>
