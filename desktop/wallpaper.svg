<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <!-- Background gradient -->
    <radialGradient id="bgGrad" cx="0.3" cy="0.4" r="0.9">
      <stop offset="0%" stop-color="#0f1f36"/>
      <stop offset="60%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#060d18"/>
    </radialGradient>

    <!-- Glow filter for cyan elements -->
    <filter id="glowCyan" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur"/>
      <feColorMatrix in="blur" type="matrix"
        values="0 0 0 0 0  0 0.8 0.9 0 0  0 0.9 1 0 0  0 0 0 1 0" result="colorBlur"/>
      <feMerge>
        <feMergeNode in="colorBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Strong glow for the crystal -->
    <filter id="glowStrong" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="12" result="blur1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Red glow for accent dots -->
    <filter id="glowRed" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Subtle outer glow -->
    <filter id="glowSoft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Scanline pattern -->
    <pattern id="scanlines" x="0" y="0" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="4" height="2" fill="black" opacity="0.06"/>
    </pattern>

    <!-- Hexagonal grid pattern -->
    <pattern id="hexGrid" x="0" y="0" width="60" height="52" patternUnits="userSpaceOnUse">
      <polygon points="30,0 60,15 60,37 30,52 0,37 0,15" fill="none" stroke="#1a3050" stroke-width="0.5" opacity="0.4"/>
      <polygon points="60,15 90,0 90,22 60,37 30,52 30,30" fill="none" stroke="#1a3050" stroke-width="0.5" opacity="0.2"/>
    </pattern>

    <!-- Circuit trace dot -->
    <radialGradient id="nodeCyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="nodeRed" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ff2d2d" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ff2d2d" stop-opacity="0"/>
    </radialGradient>

    <!-- Vignette gradient -->
    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.7">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.5"/>
    </radialGradient>
  </defs>

  <!-- Base background -->
  <rect width="1920" height="1080" fill="url(#bgGrad)"/>

  <!-- Hexagonal grid overlay -->
  <rect width="1920" height="1080" fill="url(#hexGrid)" opacity="0.5"/>

  <!-- Circuit board traces - left side radiating -->
  <g opacity="0.15" stroke="#00d4ff" stroke-width="1" fill="none">
    <!-- Main horizontal traces -->
    <path d="M0,300 L200,300 L250,280 L400,280 L420,300 L600,300"/>
    <path d="M0,320 L180,320 L220,340 L350,340 L380,310 L500,310 L530,330 L650,330"/>
    <path d="M0,500 L150,500 L180,480 L300,480 L340,500 L480,500"/>
    <path d="M0,520 L100,520 L140,540 L280,540 L300,520 L420,520 L450,540 L550,540"/>
    <path d="M0,700 L200,700 L230,680 L380,680"/>
    <path d="M0,720 L120,720 L160,740 L300,740 L320,720 L450,720"/>

    <!-- Vertical connectors -->
    <path d="M400,280 L400,340"/>
    <path d="M300,480 L300,540"/>
    <path d="M200,300 L200,500"/>
    <path d="M450,520 L450,720"/>

    <!-- Branching traces -->
    <path d="M600,300 L650,250 L750,250 L800,280"/>
    <path d="M480,500 L520,460 L620,460 L660,480 L760,480"/>
    <path d="M550,540 L600,570 L700,570 L740,540 L820,540"/>
    <path d="M380,680 L420,650 L520,650"/>
  </g>

  <!-- Circuit board traces - right side -->
  <g opacity="0.12" stroke="#00d4ff" stroke-width="1" fill="none">
    <path d="M1920,400 L1750,400 L1720,380 L1600,380 L1570,400 L1450,400"/>
    <path d="M1920,420 L1780,420 L1740,440 L1620,440 L1590,420 L1500,420"/>
    <path d="M1920,600 L1700,600 L1670,580 L1550,580"/>
    <path d="M1920,620 L1750,620 L1710,640 L1600,640 L1580,620 L1480,620"/>
    <path d="M1600,380 L1600,440"/>
    <path d="M1550,580 L1550,640"/>
    <path d="M1450,400 L1420,360 L1350,360"/>
    <path d="M1480,620 L1440,660 L1380,660"/>
  </g>

  <!-- Network nodes / circuit junctions (cyan) -->
  <g filter="url(#glowSoft)">
    <circle cx="400" cy="280" r="3" fill="#00d4ff" opacity="0.7"/>
    <circle cx="200" cy="300" r="2.5" fill="#00d4ff" opacity="0.6"/>
    <circle cx="600" cy="300" r="3" fill="#00d4ff" opacity="0.7"/>
    <circle cx="300" cy="480" r="2.5" fill="#00d4ff" opacity="0.6"/>
    <circle cx="480" cy="500" r="3" fill="#00d4ff" opacity="0.7"/>
    <circle cx="450" cy="720" r="2.5" fill="#00d4ff" opacity="0.6"/>
    <circle cx="1600" cy="380" r="3" fill="#00d4ff" opacity="0.7"/>
    <circle cx="1550" cy="580" r="2.5" fill="#00d4ff" opacity="0.6"/>
    <circle cx="800" cy="280" r="2" fill="#00d4ff" opacity="0.5"/>
    <circle cx="760" cy="480" r="2" fill="#00d4ff" opacity="0.5"/>
    <circle cx="820" cy="540" r="2" fill="#00d4ff" opacity="0.5"/>
    <circle cx="1350" cy="360" r="2" fill="#00d4ff" opacity="0.5"/>
    <circle cx="1380" cy="660" r="2" fill="#00d4ff" opacity="0.5"/>
  </g>

  <!-- Scattered red accent nodes -->
  <g filter="url(#glowRed)">
    <circle cx="650" cy="330" r="2.5" fill="#ff2d2d" opacity="0.7"/>
    <circle cx="550" cy="540" r="2" fill="#ff2d2d" opacity="0.6"/>
    <circle cx="1500" cy="420" r="2.5" fill="#ff2d2d" opacity="0.7"/>
    <circle cx="1480" cy="620" r="2" fill="#ff2d2d" opacity="0.6"/>
    <circle cx="320" cy="720" r="2" fill="#ff2d2d" opacity="0.5"/>
    <circle cx="520" cy="650" r="2" fill="#ff2d2d" opacity="0.5"/>
    <circle cx="140" cy="540" r="1.5" fill="#ff2d2d" opacity="0.4"/>
    <circle cx="1740" cy="440" r="1.5" fill="#ff2d2d" opacity="0.4"/>
  </g>

  <!-- Floating particles / data points -->
  <g opacity="0.3">
    <circle cx="120" cy="150" r="1" fill="#00d4ff"/>
    <circle cx="350" cy="100" r="0.8" fill="#00d4ff"/>
    <circle cx="580" cy="180" r="1.2" fill="#00d4ff"/>
    <circle cx="800" cy="120" r="0.7" fill="#0090c1"/>
    <circle cx="1050" cy="90" r="1" fill="#00d4ff"/>
    <circle cx="1300" cy="160" r="0.8" fill="#0090c1"/>
    <circle cx="1500" cy="100" r="1.1" fill="#00d4ff"/>
    <circle cx="1750" cy="200" r="0.7" fill="#00d4ff"/>
    <circle cx="250" cy="900" r="1" fill="#0090c1"/>
    <circle cx="500" cy="950" r="0.8" fill="#00d4ff"/>
    <circle cx="750" cy="880" r="1.2" fill="#0090c1"/>
    <circle cx="1100" cy="950" r="0.7" fill="#00d4ff"/>
    <circle cx="1400" cy="900" r="1" fill="#0090c1"/>
    <circle cx="1650" cy="870" r="0.8" fill="#00d4ff"/>
    <circle cx="1820" cy="940" r="1.1" fill="#0090c1"/>
    <circle cx="950" cy="200" r="0.6" fill="#ff2d2d" opacity="0.5"/>
    <circle cx="1200" cy="850" r="0.6" fill="#ff2d2d" opacity="0.5"/>
    <circle cx="160" cy="780" r="0.6" fill="#ff2d2d" opacity="0.5"/>
    <circle cx="1800" cy="350" r="0.6" fill="#ff2d2d" opacity="0.5"/>
  </g>

  <!-- ======= CENTRAL FROST CRYSTAL / SNOWFLAKE ======= -->
  <g transform="translate(960, 480)" filter="url(#glowStrong)">
    <!-- Outer hexagonal ring -->
    <polygon points="0,-180 155.88,-90 155.88,90 0,180 -155.88,90 -155.88,-90"
      fill="none" stroke="#00d4ff" stroke-width="1" opacity="0.2"/>

    <!-- Inner hexagonal ring -->
    <polygon points="0,-120 103.92,-60 103.92,60 0,120 -103.92,60 -103.92,-60"
      fill="none" stroke="#00d4ff" stroke-width="1.5" opacity="0.3"/>

    <!-- Six main crystal arms -->
    <g stroke="#00d4ff" stroke-width="1.5" fill="none" opacity="0.6">
      <!-- Top arm -->
      <line x1="0" y1="0" x2="0" y2="-160"/>
      <line x1="0" y1="-60" x2="-25" y2="-90"/>
      <line x1="0" y1="-60" x2="25" y2="-90"/>
      <line x1="0" y1="-100" x2="-35" y2="-130"/>
      <line x1="0" y1="-100" x2="35" y2="-130"/>
      <line x1="0" y1="-130" x2="-18" y2="-150"/>
      <line x1="0" y1="-130" x2="18" y2="-150"/>

      <!-- Top-right arm -->
      <line x1="0" y1="0" x2="138.56" y2="-80"/>
      <line x1="51.96" y1="-30" x2="73.61" y2="-67.5"/>
      <line x1="51.96" y1="-30" x2="86.6" y2="-20"/>
      <line x1="86.6" y1="-50" x2="108.25" y2="-87.5"/>
      <line x1="86.6" y1="-50" x2="121.24" y2="-40"/>
      <line x1="112.58" y1="-65" x2="128.36" y2="-87"/>
      <line x1="112.58" y1="-65" x2="134.24" y2="-55"/>

      <!-- Bottom-right arm -->
      <line x1="0" y1="0" x2="138.56" y2="80"/>
      <line x1="51.96" y1="30" x2="86.6" y2="20"/>
      <line x1="51.96" y1="30" x2="73.61" y2="67.5"/>
      <line x1="86.6" y1="50" x2="121.24" y2="40"/>
      <line x1="86.6" y1="50" x2="108.25" y2="87.5"/>
      <line x1="112.58" y1="65" x2="134.24" y2="55"/>
      <line x1="112.58" y1="65" x2="128.36" y2="87"/>

      <!-- Bottom arm -->
      <line x1="0" y1="0" x2="0" y2="160"/>
      <line x1="0" y1="60" x2="-25" y2="90"/>
      <line x1="0" y1="60" x2="25" y2="90"/>
      <line x1="0" y1="100" x2="-35" y2="130"/>
      <line x1="0" y1="100" x2="35" y2="130"/>
      <line x1="0" y1="130" x2="-18" y2="150"/>
      <line x1="0" y1="130" x2="18" y2="150"/>

      <!-- Bottom-left arm -->
      <line x1="0" y1="0" x2="-138.56" y2="80"/>
      <line x1="-51.96" y1="30" x2="-86.6" y2="20"/>
      <line x1="-51.96" y1="30" x2="-73.61" y2="67.5"/>
      <line x1="-86.6" y1="50" x2="-121.24" y2="40"/>
      <line x1="-86.6" y1="50" x2="-108.25" y2="87.5"/>
      <line x1="-112.58" y1="65" x2="-134.24" y2="55"/>
      <line x1="-112.58" y1="65" x2="-128.36" y2="87"/>

      <!-- Top-left arm -->
      <line x1="0" y1="0" x2="-138.56" y2="-80"/>
      <line x1="-51.96" y1="-30" x2="-73.61" y2="-67.5"/>
      <line x1="-51.96" y1="-30" x2="-86.6" y2="-20"/>
      <line x1="-86.6" y1="-50" x2="-108.25" y2="-87.5"/>
      <line x1="-86.6" y1="-50" x2="-121.24" y2="-40"/>
      <line x1="-112.58" y1="-65" x2="-128.36" y2="-87"/>
      <line x1="-112.58" y1="-65" x2="-134.24" y2="-55"/>
    </g>

    <!-- Center crystal core -->
    <polygon points="0,-30 25.98,-15 25.98,15 0,30 -25.98,15 -25.98,-15"
      fill="#00d4ff" opacity="0.15" stroke="#00d4ff" stroke-width="1.5"/>
    <polygon points="0,-15 12.99,-7.5 12.99,7.5 0,15 -12.99,7.5 -12.99,-7.5"
      fill="#00d4ff" opacity="0.3"/>
    <circle cx="0" cy="0" r="4" fill="#00d4ff" opacity="0.8"/>

    <!-- Red accent points at crystal tips -->
    <circle cx="0" cy="-160" r="2.5" fill="#ff2d2d" opacity="0.7"/>
    <circle cx="138.56" cy="-80" r="2.5" fill="#ff2d2d" opacity="0.7"/>
    <circle cx="138.56" cy="80" r="2.5" fill="#ff2d2d" opacity="0.7"/>
    <circle cx="0" cy="160" r="2.5" fill="#ff2d2d" opacity="0.7"/>
    <circle cx="-138.56" cy="80" r="2.5" fill="#ff2d2d" opacity="0.7"/>
    <circle cx="-138.56" cy="-80" r="2.5" fill="#ff2d2d" opacity="0.7"/>

    <!-- Cyan dots at branch points -->
    <circle cx="0" cy="-60" r="2" fill="#00d4ff" opacity="0.6"/>
    <circle cx="0" cy="-100" r="2" fill="#00d4ff" opacity="0.6"/>
    <circle cx="51.96" cy="-30" r="2" fill="#00d4ff" opacity="0.6"/>
    <circle cx="86.6" cy="-50" r="2" fill="#00d4ff" opacity="0.6"/>
    <circle cx="51.96" cy="30" r="2" fill="#00d4ff" opacity="0.6"/>
    <circle cx="86.6" cy="50" r="2" fill="#00d4ff" opacity="0.6"/>
    <circle cx="0" cy="60" r="2" fill="#00d4ff" opacity="0.6"/>
    <circle cx="0" cy="100" r="2" fill="#00d4ff" opacity="0.6"/>
    <circle cx="-51.96" cy="30" r="2" fill="#00d4ff" opacity="0.6"/>
    <circle cx="-86.6" cy="50" r="2" fill="#00d4ff" opacity="0.6"/>
    <circle cx="-51.96" cy="-30" r="2" fill="#00d4ff" opacity="0.6"/>
    <circle cx="-86.6" cy="-50" r="2" fill="#00d4ff" opacity="0.6"/>
  </g>

  <!-- Diagonal data stream lines (subtle) -->
  <g stroke="#00d4ff" stroke-width="0.5" opacity="0.08">
    <line x1="0" y1="0" x2="400" y2="1080"/>
    <line x1="200" y1="0" x2="600" y2="1080"/>
    <line x1="1520" y1="0" x2="1920" y2="1080"/>
    <line x1="1720" y1="0" x2="1920" y2="500"/>
    <line x1="0" y1="600" x2="300" y2="1080"/>
  </g>

  <!-- frOSt wordmark - bottom right -->
  <g transform="translate(1720, 1020)" opacity="0.35">
    <text font-family="monospace, 'Courier New', monospace" font-size="32"
      fill="#00d4ff" font-weight="bold" letter-spacing="2">
      <tspan>fr</tspan><tspan fill="#e0f0ff">OS</tspan><tspan fill="#00d4ff">t</tspan>
    </text>
    <text font-family="monospace, 'Courier New', monospace" font-size="10"
      fill="#6b8299" y="16" letter-spacing="1">
      FROZEN OPERATING SYSTEM
    </text>
  </g>

  <!-- Version tag - bottom left -->
  <g transform="translate(30, 1060)" opacity="0.15">
    <text font-family="monospace" font-size="9" fill="#6b8299">
      v1.0 // OVERLAY_ACTIVE // PERSISTENCE_ENABLED
    </text>
  </g>

  <!-- Scanline overlay (CRT effect) -->
  <rect width="1920" height="1080" fill="url(#scanlines)"/>

  <!-- Vignette effect -->
  <rect width="1920" height="1080" fill="url(#vignette)"/>
</svg>
