# frOSt Neofetch Configuration
# Custom ASCII art and frost color scheme

print_info() {
    info title
    prin "$(color 4)─────────────────────────────"
    info "OS" distro
    info "Kernel" kernel
    info "Uptime" uptime
    info "Packages" packages
    info "Shell" shell
    info "DE" de
    info "WM" wm
    info "Terminal" term
    info "CPU" cpu
    info "GPU" gpu
    info "Memory" memory
    prin "$(color 4)─────────────────────────────"
    info "Disk (/)" disk
    prin ""
    prin "$(color 1)  $(color 2)  $(color 3)  $(color 4)  $(color 5)  $(color 6)  $(color 7)  $(color 8)  "
}

# Title
title_fqdn="off"

# Kernel
kernel_shorthand="on"

# Distro
distro_shorthand="off"
os_arch="on"

# Uptime
uptime_shorthand="tiny"

# Memory
memory_percent="on"
memory_unit="gib"

# Packages
package_managers="on"

# Shell
shell_path="off"
shell_version="on"

# CPU
speed_type="bios_limit"
speed_shorthand="off"
cpu_brand="on"
cpu_speed="on"
cpu_cores="logical"
cpu_temp="off"

# GPU
gpu_brand="on"
gpu_type="all"

# Disk
disk_show=('/')
disk_subtitle="none"
disk_percent="on"

# Colors
colors=(4 6 1 4 4 7)
bold="on"
underline_enabled="on"
underline_char="-"
separator=":"

# Backend
image_backend="ascii"
image_source="auto"

# Custom ASCII art
ascii_distro="auto"
ascii_colors=(4 6)

# Gap
gap=3

# Custom frOSt ASCII art
image_source="${HOME}/.config/neofetch/frost-ascii"
